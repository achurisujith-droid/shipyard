<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer has no Node access. This CSP additionally blocks remote code,
      so a compromised page cannot pull anything down. 'unsafe-inline' is needed
      for styles only; scripts are restricted to same-origin bundles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5273 http://localhost:5273"
    />
    <title>Shipyard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/renderer/main.tsx"></script>
  </body>
</html>
